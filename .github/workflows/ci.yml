name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.16.0 --activate

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev,live]"

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Python quality and tests
        run: |
          python -m ruff check .
          python -m mypy apps/api/src
          python -m pytest -q
          python scripts/regenerate_examples.py --check

      - name: Web quality and unit tests
        run: |
          pnpm --filter @changesafe/web lint
          pnpm --filter @changesafe/web typecheck
          pnpm --filter @changesafe/web test --run
          pnpm --filter @changesafe/web build

      - name: Install browser runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Credential-free browser acceptance
        run: pnpm exec playwright test

      - name: Secret and license gates
        run: |
          python scripts/check_secrets.py
          test -s LICENSE
          grep -q "Apache License" LICENSE

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  dbt-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dbt runtime
        run: python -m pip install -e ".[dbt]"
      - name: Parse and materialize sample migration
        run: |
          dbt parse --project-dir fixtures/dbt_project --profiles-dir fixtures/dbt_project
          dbt build --project-dir fixtures/dbt_project --profiles-dir fixtures/dbt_project

  container-smoke:
    needs: [quality, dbt-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build release image
        run: docker build -t changesafe:ci .
      - name: Exercise health and single-origin UI
        run: |
          docker run --rm -d --name changesafe-ci -p 18000:8000 changesafe:ci
          trap 'docker stop changesafe-ci' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18000/healthz && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18000/ | grep -q "ChangeSafe"
          run_id=$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"asset_urn":"urn:li:dataset:(urn:li:dataPlatform:dbt,b2fd91.ORDER_ENTRY_DB.analytics.order_details,PROD)","operation":"rename","field":"cust_email","new_field":"primary_email","source_commit":"showcase-ecommerce-safe-rename","requested_by":"ci"}' \
            http://127.0.0.1:18000/api/runs \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['run_id'])")
          for attempt in $(seq 1 50); do
            run_json=$(curl --fail --silent "http://127.0.0.1:18000/api/runs/${run_id}")
            state=$(printf '%s' "${run_json}" | python3 -c "import json,sys; print(json.load(sys.stdin)['state'])")
            [ "${state}" = "awaiting_approval" ] && break
            [ "${state}" = "failed" ] && exit 1
            sleep 0.2
          done
          export RUN_JSON="${run_json}"
          python3 -c "import json,os; r=json.loads(os.environ['RUN_JSON']); assert r['state']=='awaiting_approval'; assert r['analysis']['risk']['score']==85; assert len(r['analysis']['impacts'])==6; assert len(r['analysis']['context']['downstream_assets'])==25; assert len(r['analysis']['artifacts']['files'])==7; assert r['analysis']['validation']['passed']"
          curl --fail --silent -X POST "http://127.0.0.1:18000/api/runs/${run_id}/approve" | grep -q '"mode":"preview"'
          curl --fail --silent "http://127.0.0.1:18000/api/runs/${run_id}/publication.patch" | grep -q '^diff --git'

  optional-live-readiness:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATAHUB_GMS_URL: ${{ secrets.DATAHUB_GMS_URL }}
      DATAHUB_GMS_TOKEN: ${{ secrets.DATAHUB_GMS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.CHANGESAFE_GITHUB_TOKEN }}
      CHANGESAFE_GITHUB_REPOSITORY: ${{ vars.CHANGESAFE_GITHUB_REPOSITORY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install live adapter
        run: python -m pip install -e ".[live]"

      - name: DataHub live contract smoke
        if: env.DATAHUB_GMS_URL != '' && env.DATAHUB_GMS_TOKEN != ''
        run: python scripts/seed_datahub.py --verify-only

      - name: GitHub repository access smoke
        if: env.GITHUB_TOKEN != '' && env.CHANGESAFE_GITHUB_REPOSITORY != ''
        run: >-
          curl --fail --silent --show-error --output /dev/null
          -H "Authorization: Bearer ${GITHUB_TOKEN}"
          -H "Accept: application/vnd.github+json"
          "https://api.github.com/repos/${CHANGESAFE_GITHUB_REPOSITORY}"

      - name: Explain skipped live checks
        if: env.DATAHUB_GMS_TOKEN == '' && env.GITHUB_TOKEN == ''
        run: echo "Live readiness checks skipped because no optional credentials were configured."
