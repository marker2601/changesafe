services:
  changesafe:
    build:
      context: .
    image: changesafe:local
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "${CHANGESAFE_PORT:-8000}:8000"
    environment:
      CHANGESAFE_MODE: "${CHANGESAFE_MODE:-replay}"
      CHANGESAFE_DATA_PATH: /data/changesafe.db
      CHANGESAFE_WEB_DIST: /app/web
      DATAHUB_GMS_URL: "${DATAHUB_GMS_URL:-}"
      DATAHUB_GMS_TOKEN: "${DATAHUB_GMS_TOKEN:-}"
      DATAHUB_TIMEOUT_SECONDS: "${DATAHUB_TIMEOUT_SECONDS:-8}"
      DATAHUB_RETRY_COUNT: "${DATAHUB_RETRY_COUNT:-1}"
      DEMO_URN_ALLOWLIST: "${DEMO_URN_ALLOWLIST:-urn:li:dataset:(urn:li:dataPlatform:dbt,analytics.dim_customers,PROD)}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5.6-luna}"
      OPENAI_INPUT_COST_PER_MILLION_USD: "${OPENAI_INPUT_COST_PER_MILLION_USD:-10}"
      OPENAI_OUTPUT_COST_PER_MILLION_USD: "${OPENAI_OUTPUT_COST_PER_MILLION_USD:-60}"
      OPENAI_MAX_INPUT_TOKENS_PER_CALL: "${OPENAI_MAX_INPUT_TOKENS_PER_CALL:-16000}"
      OPENAI_MAX_OUTPUT_TOKENS_PER_CALL: "${OPENAI_MAX_OUTPUT_TOKENS_PER_CALL:-1800}"
      CHANGESAFE_LLM_BUDGET_USD: "${CHANGESAFE_LLM_BUDGET_USD:-5}"
      CHANGESAFE_RUNS_PER_MINUTE: "${CHANGESAFE_RUNS_PER_MINUTE:-10}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      CHANGESAFE_GITHUB_REPOSITORY: "${CHANGESAFE_GITHUB_REPOSITORY:-}"
      GITHUB_BASE_BRANCH: "${GITHUB_BASE_BRANCH:-main}"
      PUBLIC_PR_ENABLED: "${PUBLIC_PR_ENABLED:-false}"
      PUBLIC_WRITEBACK_ENABLED: "${PUBLIC_WRITEBACK_ENABLED:-false}"
      CHANGESAFE_ADMIN_TOKEN: "${CHANGESAFE_ADMIN_TOKEN:-}"
    volumes:
      - changesafe-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2))['status'] == 'ok'"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  changesafe-data:
