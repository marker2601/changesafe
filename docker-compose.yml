services:
  changesafe:
    build:
      context: .
    image: changesafe:local
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "${CHANGESAFE_PORT:-8000}:8000"
    environment:
      CHANGESAFE_MODE: "${CHANGESAFE_MODE:-replay}"
      CHANGESAFE_DATA_PATH: /data/changesafe.db
      CHANGESAFE_WEB_DIST: /app/web
      DATAHUB_GMS_URL: "${DATAHUB_GMS_URL:-}"
      DATAHUB_GMS_TOKEN: "${DATAHUB_GMS_TOKEN:-}"
      DATAHUB_UI_URL: "${DATAHUB_UI_URL:-}"
      DATAHUB_TIMEOUT_SECONDS: "${DATAHUB_TIMEOUT_SECONDS:-8}"
      DATAHUB_RETRY_COUNT: "${DATAHUB_RETRY_COUNT:-1}"
      SAVE_DOCUMENT_RESTRICT_UPDATES: "${SAVE_DOCUMENT_RESTRICT_UPDATES:-true}"
      DEMO_URN_ALLOWLIST: "${DEMO_URN_ALLOWLIST:-urn:li:dataset:(urn:li:dataPlatform:dbt,b2fd91.ORDER_ENTRY_DB.analytics.order_details,PROD)}"
      CHANGESAFE_RUNS_PER_MINUTE: "${CHANGESAFE_RUNS_PER_MINUTE:-10}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      CHANGESAFE_GITHUB_REPOSITORY: "${CHANGESAFE_GITHUB_REPOSITORY:-}"
      GITHUB_BASE_BRANCH: "${GITHUB_BASE_BRANCH:-main}"
      PUBLIC_PR_ENABLED: "${PUBLIC_PR_ENABLED:-false}"
      PUBLIC_WRITEBACK_ENABLED: "${PUBLIC_WRITEBACK_ENABLED:-false}"
      CHANGESAFE_ADMIN_TOKEN: "${CHANGESAFE_ADMIN_TOKEN:-}"
      CHANGESAFE_LIVE_EVIDENCE_REQUIRED: "${CHANGESAFE_LIVE_EVIDENCE_REQUIRED:-false}"
      CHANGESAFE_WAREHOUSE_VALIDATION_ENABLED: "${CHANGESAFE_WAREHOUSE_VALIDATION_ENABLED:-false}"
      CHANGESAFE_WAREHOUSE_VALIDATION_REQUIRED: "${CHANGESAFE_WAREHOUSE_VALIDATION_REQUIRED:-false}"
      CHANGESAFE_WAREHOUSE_TIMEOUT_SECONDS: "${CHANGESAFE_WAREHOUSE_TIMEOUT_SECONDS:-20}"
      CHANGESAFE_WAREHOUSE_EVIDENCE_MAX_AGE_SECONDS: "${CHANGESAFE_WAREHOUSE_EVIDENCE_MAX_AGE_SECONDS:-900}"
      CHANGESAFE_WAREHOUSE_ENVIRONMENT_LABEL: "${CHANGESAFE_WAREHOUSE_ENVIRONMENT_LABEL:-competition-non-production}"
      SNOWFLAKE_ACCOUNT: "${SNOWFLAKE_ACCOUNT:-}"
      SNOWFLAKE_USER: "${SNOWFLAKE_USER:-}"
      SNOWFLAKE_AUTHENTICATOR: "${SNOWFLAKE_AUTHENTICATOR:-SNOWFLAKE_JWT}"
      SNOWFLAKE_PRIVATE_KEY_PATH: "${SNOWFLAKE_PRIVATE_KEY_PATH:-}"
      SNOWFLAKE_WAREHOUSE: "${SNOWFLAKE_WAREHOUSE:-}"
      SNOWFLAKE_DATABASE: "${SNOWFLAKE_DATABASE:-}"
      SNOWFLAKE_SCHEMA: "${SNOWFLAKE_SCHEMA:-}"
      SNOWFLAKE_ROLE: "${SNOWFLAKE_ROLE:-}"
      SNOWFLAKE_TARGET_RELATION_ALLOWLIST: "${SNOWFLAKE_TARGET_RELATION_ALLOWLIST:-{}}"
    volumes:
      - changesafe-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2))['status'] == 'ok'"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  changesafe-warehouse:
    profiles: ["warehouse"]
    extends:
      service: changesafe
    environment:
      SNOWFLAKE_PRIVATE_KEY_PATH: /run/secrets/snowflake-private-key.p8
    volumes:
      - changesafe-data:/data
      - type: bind
        source: "${SNOWFLAKE_PRIVATE_KEY_PATH:-./.changesafe-private/snowflake-private-key-not-configured.p8}"
        target: /run/secrets/snowflake-private-key.p8
        read_only: true
        bind:
          create_host_path: false

volumes:
  changesafe-data:
