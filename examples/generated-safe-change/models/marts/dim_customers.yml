version: 2

models:
  - name: dim_customers
    description: Governed customer dimension with a phase-one compatibility alias.
    config:
      contract:
        enforced: true
    columns:
      - name: customer_id
        data_type: STRING
        tests: [not_null, unique]
      - name: customer_email
        data_type: STRING
        description: Deprecated compatibility field retained during phase one.
        tests: [not_null]
      - name: primary_email
        data_type: STRING
        description: Preferred field for migrated consumers.
        tests: [not_null]
      - name: customer_name
        data_type: STRING
      - name: customer_status
        data_type: STRING
      - name: created_at
        data_type: TIMESTAMP
